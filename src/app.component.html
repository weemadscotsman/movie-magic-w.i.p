
@if (!hasAccess()) {
  <app-gateway (enter)="grantAccess()"></app-gateway>
} @else {
  <div class="flex flex-col h-screen w-screen bg-zinc-950 text-zinc-200 animate-in fade-in duration-700">
    
    <!-- Top Bar -->
    <header class="h-14 border-b border-zinc-800 flex items-center justify-between px-6 bg-zinc-900/50 backdrop-blur-md z-10">
      <div class="flex items-center gap-2">
        <div class="w-4 h-4 bg-orange-600 rounded-sm"></div>
        <h1 class="font-bold tracking-widest text-sm text-zinc-100">CINEMA<span class="text-zinc-500 font-light">RIG</span></h1>
      </div>
      <div class="flex gap-4 text-xs font-mono text-zinc-500 items-center">
        <button (click)="toggleSettings()" class="hover:text-white transition-colors uppercase tracking-widest text-[10px] flex items-center gap-1 px-2 py-1 hover:bg-zinc-800 border border-transparent hover:border-zinc-700 rounded-sm">
           <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
           CONFIG
        </button>
        <div class="h-4 w-px bg-zinc-800"></div>
        <div class="flex items-center gap-1">
          <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div> SYSTEM ONLINE
        </div>
        <div>V 2.6.0</div>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 relative flex flex-col">
      
      <!-- Video Area -->
      <div class="flex-1 bg-black relative">
         <app-video-stage 
           (frameCaptured)="onFrameCaptured($event)"
           (targetDeclared)="onTargetDeclared($event)"
         ></app-video-stage>
      </div>

      <!-- Bottom Control Deck -->
      <div class="h-24 bg-zinc-900 border-t border-zinc-800 p-4 flex items-center justify-between gap-8">
         
         <!-- Step 1: Status -->
         <div class="flex flex-col gap-1 w-64">
           <div class="text-[10px] text-zinc-500 font-bold tracking-wider uppercase">Target Status</div>
           @if (targetReady()) {
             <div class="text-green-500 text-sm font-mono flex items-center gap-2">
               <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
               DECLARED
             </div>
           } @else {
             <div class="text-zinc-600 text-sm font-mono animate-pulse">WAITING FOR DRAW...</div>
           }
         </div>

         <!-- Step 2: Identity Source -->
         <div class="flex flex-col gap-1 flex-1 max-w-sm">
            <div class="text-[10px] text-zinc-500 font-bold tracking-wider uppercase">Source Identity</div>
            
            @if (!userIdentityImage()) {
               <button (click)="openCapture()" class="flex items-center gap-3 text-zinc-400 hover:text-white transition-colors group text-left">
                 <div class="w-10 h-10 border border-dashed border-zinc-600 rounded flex items-center justify-center group-hover:border-zinc-400">
                   <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                 </div>
                 <div>
                   <div class="text-xs font-bold">ADD REFERENCE</div>
                   <div class="text-[10px] text-zinc-600">Camera / Scan</div>
                 </div>
               </button>
            } @else {
               <div class="flex items-center gap-3">
                 <img [src]="userIdentityImage()" class="w-10 h-10 object-cover rounded border border-zinc-600">
                 <div>
                   <div class="text-xs font-bold text-zinc-300">ID CAPTURED</div>
                   <button (click)="openCapture()" class="text-[10px] text-zinc-500 hover:text-zinc-300 underline">Replace</button>
                 </div>
               </div>
            }
         </div>

         <!-- Step 3: GO Button -->
         <button 
           (click)="startProcessing()"
           [disabled]="goButtonState !== 'ready'"
           class="h-full px-12 bg-orange-600 hover:bg-orange-500 disabled:bg-zinc-800 disabled:text-zinc-600 disabled:cursor-not-allowed text-white font-black italic tracking-tighter text-2xl transition-all shadow-[0_0_20px_rgba(234,88,12,0.3)] disabled:shadow-none clip-path-slant"
           style="clip-path: polygon(10% 0, 100% 0, 100% 100%, 0% 100%);"
         >
           RENDER
         </button>

      </div>

      <!-- Modals & Overlays -->
      @if (showSettings()) {
        <app-settings-panel (close)="toggleSettings()"></app-settings-panel>
      }

      @if (showCaptureModal()) {
        <app-capture-modal 
          (close)="closeCapture()"
          (imageConfirmed)="onIdentityConfirmed($event)"
        ></app-capture-modal>
      }

      @if (isProcessing()) {
        <app-pipeline-visualizer 
          [startTrigger]="isProcessing()"
          [aiData]="aiAnalysisData()"
        ></app-pipeline-visualizer>
      }

    </main>
  </div>
}
